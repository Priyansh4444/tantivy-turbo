version: 2
updates:
- package-ecosystem: cargo
  directory: "/"
  schedule:
    interval: daily
    time: "20:00"
  open-pull-requests-limit: 10
  cooldown:
    default-days: 2
  groups:
    cranelift:
      patterns:
        - "cranelift"
        - "cranelift-*"
    rand-family:
      patterns:
        - "rand"
        - "rand_distr"

- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: daily
    time: "20:00"
  open-pull-requests-limit: 10
  cooldown:
    default-days: 2
